<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ค้นหาบริการ — GlowGo</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div id="nav"></div>

  <section class="section container">
    <span class="emotion-tag">ขั้นที่ 3 · สนใจจดจ่อ — ค้นหา เทียบ เลือกได้ในที่เดียว</span>
    <h1 class="page-title">ค้นหา &amp; เลือกบริการ</h1>
    <p class="page-sub">กรองตามหมวด โซน ราคา และเรตติ้ง แล้วเทียบร้านได้ทันที</p>

    <div class="filter-bar glass">
      <input type="text" id="q" placeholder="🔍 ค้นหาชื่อร้าน...">
      <select id="catFilter"><option value="">ทุกหมวด</option></select>
      <select id="zoneFilter"><option value="">ทุกโซน</option></select>
      <select id="sortBy">
        <option value="rating">เรตติ้งสูงสุด</option>
        <option value="priceLow">ราคาต่ำ→สูง</option>
        <option value="priceHigh">ราคาสูง→ต่ำ</option>
        <option value="reviews">รีวิวเยอะสุด</option>
      </select>
      <label style="font-size:14px;display:flex;align-items:center;gap:6px">
        <input type="checkbox" id="certOnly" style="width:auto"> รับรองสะอาด
      </label>
      <label style="font-size:14px;display:flex;align-items:center;gap:6px">
        <input type="checkbox" id="favOnly" style="width:auto"> ❤️ เฉพาะโปรด
      </label>
    </div>

    <p id="count" class="page-sub"></p>
    <div class="shop-grid" id="results"></div>
  </section>

  <div id="footer"></div>

  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/search.js"></script>
</body>
</html>
