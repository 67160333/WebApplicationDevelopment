<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ — GlowGo</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div id="nav"></div>

  <div class="auth-wrap">
    <div class="card glass reveal">
      <span class="emotion-tag">ขั้นที่ 2 · ใจร้อน — ทำให้เข้าสู่ระบบเร็วที่สุด</span>
      <h1 class="page-title">เข้าสู่ระบบ</h1>
      <p class="page-sub">ยินดีต้อนรับกลับสู่ GlowGo</p>

      <!-- แก้ pain point: ล็อกอินด้วย Google / LINE -->
      <div class="social-btns">
        <button class="btn btn-outline" onclick="social('Google')">ต่อด้วย Google</button>
        <button class="btn btn-outline" onclick="social('LINE')">ต่อด้วย LINE</button>
      </div>
      <div class="divider">— หรือ —</div>

      <form id="loginForm">
        <div class="form-group">
          <label>อีเมล</label>
          <input type="email" id="email" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label>รหัสผ่าน</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">เข้าสู่ระบบ</button>
      </form>

      <p class="hint" style="text-align:center;margin-top:16px">
        ยังไม่มีบัญชี? <a href="signup.html" style="color:var(--primary);font-weight:700">สมัครสมาชิก</a>
      </p>
    </div>
  </div>

  <div id="footer"></div>

  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
  <script>
    initPage("");

    function nextUrl() {
      const p = new URLSearchParams(location.search).get("next");
      return p ? decodeURIComponent(p) : "../index.html";
    }

    document.getElementById("loginForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value;
      Auth.login("มายด์", email);
      toast("เข้าสู่ระบบสำเร็จ");
      setTimeout(() => location.href = nextUrl(), 700);
    });

    function social(provider) {
      Auth.login("มายด์", "mind@" + provider.toLowerCase() + ".com");
      toast("เข้าสู่ระบบด้วย " + provider);
      setTimeout(() => location.href = nextUrl(), 700);
    }
  </script>
</body>
</html>
