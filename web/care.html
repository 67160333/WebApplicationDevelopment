<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ดูแลตัวเอง — Bookvice</title>
  <meta name="description" content="สปา ทำเล็บ ทำผม คลินิก สักลาย และคลินิกสุขภาพชาย — เลือกช่างที่ถูกใจ ดูรีวิวรายคน" />
  <meta name="theme-color" content="#16233F" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'><defs><linearGradient id='a' x1='6' y1='4' x2='34' y2='28' gradientUnits='userSpaceOnUse'><stop stop-color='%232563EB'/><stop offset='1' stop-color='%238B5CF6'/></linearGradient><linearGradient id='b' x1='8' y1='40' x2='42' y2='24' gradientUnits='userSpaceOnUse'><stop stop-color='%23FBBF24'/><stop offset='.55' stop-color='%23F472B6'/><stop offset='1' stop-color='%23EC4899'/></linearGradient></defs><path d='M6 9a5 5 0 0 1 5-5h15a11.5 11.5 0 0 1 3.6 22.4A12 12 0 0 1 28 44H11a5 5 0 0 1-5-5z' fill='url(%23a)'/><path d='M6 33c7-7 16-10 26-8a12 12 0 0 1-4 19H11a5 5 0 0 1-5-5z' fill='url(%23b)'/><rect x='12.5' y='11' width='15' height='13' rx='3.2' fill='%23fff'/><path d='m16.4 17.6 2.6 2.6 4.8-4.8' stroke='%232563EB' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round' fill='none'/><path d='M33.5 27.5a4.6 4.6 0 0 0-4.6 4.6c0 3.4 4.6 7.6 4.6 7.6s4.6-4.2 4.6-7.6a4.6 4.6 0 0 0-4.6-4.6z' fill='%23fff'/></svg>" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Bookvice" />
  <meta property="og:title" content="ดูแลตัวเอง — Bookvice" />
  <meta property="og:description" content="สปา ทำเล็บ ทำผม คลินิก สักลาย และคลินิกสุขภาพชาย — เลือกช่างที่ถูกใจ ดูรีวิวรายคน" />
  <meta name="twitter:card" content="summary" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai+Looped:wght@400;500;600;700&display=optional" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css?v=202610210300" />
</head>
<body>
  <a href="#main" class="skip-link">ข้ามไปเนื้อหาหลัก</a>
  <div id="navbar"></div>

  <main id="main" class="max-w-6xl mx-auto px-5 py-10">
    <section class="grp-hero grp-care">
      <div class="grp-hero-in">
        <span class="grp-ic" data-ic="leaf"></span>
        <div>
          <h1 class="h1 grp-h1">ดูแลตัวเอง</h1>
          <p class="grp-lead">ไปที่ร้าน มีคนดูแลให้ · เลือกช่างที่ถูกใจได้เอง และดูรีวิวของช่างแต่ละคนก่อนจอง</p>
        </div>
      </div>

      <nav class="grp-switch" aria-label="เปลี่ยนกลุ่มบริการ"></nav>
    </section>

    <div id="browse"></div>
  </main>

  <div id="footer"></div>

  <script src="js/api.js?v=202610210300"></script>
  <script src="js/ui.js?v=202610210300"></script>
  <script src="js/browse.js?v=202610210300"></script>
  <script>
    renderNavbar("g:care");
    renderFooter();
    prefetchOnHover();


    // ไอคอนหัวหน้าเพจ — ใส่จาก JS เพราะชุดไอคอนอยู่ใน ui.js ไฟล์เดียว
    document.querySelectorAll("[data-ic]").forEach((el) => {
      el.innerHTML = icon(el.dataset.ic, 26);
    });

    // แถบสลับกลุ่ม — สร้างจาก GROUPS ใน ui.js ไม่ใช่พิมพ์ชื่อซ้ำในทุกหน้า
    // ถ้าวันหนึ่งเปลี่ยนชื่อกลุ่ม จะเปลี่ยนที่เดียวแล้วถูกทั้งเว็บ
    renderGroupSwitch("care");

    // กลุ่มนี้ตัดสินใจด้วย "คน" — ช่างคนไหน มือดีแค่ไหน คนอื่นว่ายังไง
    // การ์ดจึงเน้นดาว จำนวนรีวิว และจำนวนช่าง มากกว่าราคาหรือเวลาปิด
    BrowsePage.init({
      group: "care",
      page: "care.html",
      limit: 9,
      searchLabel: "ค้นหาร้าน เช่น นวดแผนไทย ต่อขนตา",
      categoryLabel: "ประเภทบริการ",
      sortHint: "เรียงตามคะแนนรีวิว",
      empty: "ไม่พบร้านที่ตรงกับเงื่อนไข",
      emptyAvail: "ไม่มีร้านไหนว่างในวันนั้น",
      filters: { category: true, district: true, rating: true, certified: true, near: true },
      quickChips: [
        { label: "ทั้งหมด", value: "" },
        { label: "ว่างวันนี้", value: "today" },
        { label: "ว่างพรุ่งนี้", value: "tomorrow" },
      ],
      card: (s) => `
        <a href="shop.html?id=${s.id}" class="card card-link overflow-hidden">
          ${shopArt(s, "h-36", { tag: s.is_certified ? "ผ่านการรับรอง" : null })}
          <div class="p-5">
            <h3 class="h3 leading-snug">${esc(s.name)}</h3>
            <div class="flex items-center gap-2 mt-2.5">
              ${starRow(s.rating_avg)}
              <span class="text-xs text-muted num">
                ${Number(s.rating_avg).toFixed(1)} · ${s.rating_count} รีวิว
              </span>
            </div>
            <div class="flex items-center gap-3 mt-3 text-xs text-muted flex-wrap">
              <span>${icon("user", 13)} ${s.resource_count} ${esc(s.resource_label)}</span>
              ${priceFrom(s) ? `<span>${priceFrom(s)}</span>` : ""}
            </div>
            ${cardFoot(s)}
          </div>
        </a>`,
    });
  </script>
</body>
</html>
