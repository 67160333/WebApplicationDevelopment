server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # ส่วนหัวความปลอดภัย — ชุดเดียวกับที่ FastAPI ใส่ให้ (ดู app/main.py)
    # ต้องมีทั้งสองที่ เพราะในเครื่อง nginx เป็นคนเสิร์ฟหน้าเว็บ ไม่ได้ผ่าน FastAPI
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), payment=(), geolocation=(self)" always;

    # หน้าที่ไม่มีอยู่จริงต้องได้ 404.html ไม่ใช่หน้าเปล่าของ nginx
    # (ฝั่งเว็บจริงที่ FastAPI เสิร์ฟเอง มีตัวจัดการ 404 แยกอยู่ใน app/main.py)
    error_page 404 /404.html;
    location = /404.html { internal; }

    # ระหว่างพัฒนา ไม่ให้เบราว์เซอร์แคชไฟล์ HTML/CSS/JS
    # เพื่อให้แก้โค้ดแล้วรีเฟรชเห็นผลทันที ไม่ต้องล้างแคชเอง
    location ~* \.(html|css|js)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        # ต้องใส่ซ้ำตรงนี้ด้วย — nginx มีกฎว่า add_header ใน location
        # จะ "ทับ" ของที่สืบทอดมาจาก server ทั้งชุด ไม่ใช่เพิ่มต่อท้าย
        # ถ้าไม่ใส่ซ้ำ ไฟล์ html/css/js จะไม่มีส่วนหัวความปลอดภัยเลยสักตัว
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), payment=(), geolocation=(self)" always;
        try_files $uri $uri/ =404;
    }

    # ของเดิมส่งทุกเส้นทางที่ไม่รู้จักไปที่ index.html ซึ่งเหมาะกับเว็บแบบ SPA
    # แต่เว็บนี้เป็นหลายหน้าแยกไฟล์ ผลคือพิมพ์ URL มั่วแล้วได้หน้าแรกพร้อมสถานะ 200
    # ทั้งที่ควรเป็น 404 — ผู้ใช้งงว่าทำไมลิงก์พาไปหน้าแรก และบอตค้นหาก็เก็บหน้าซ้ำ
    location / {
        try_files $uri $uri/ =404;
    }
}
