<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ค้นหาทุกหมวดรวมกัน — Bookvice</title>
  <meta name="description" content="ค้นหาข้ามทุกหมวดในครั้งเดียว — ร้านความงาม สนามกีฬา ศูนย์ดูแลรถ และบริการเรียกถึงบ้าน" />
  <meta name="theme-color" content="#16233F" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'><defs><linearGradient id='a' x1='6' y1='4' x2='34' y2='28' gradientUnits='userSpaceOnUse'><stop stop-color='%232563EB'/><stop offset='1' stop-color='%238B5CF6'/></linearGradient><linearGradient id='b' x1='8' y1='40' x2='42' y2='24' gradientUnits='userSpaceOnUse'><stop stop-color='%23FBBF24'/><stop offset='.55' stop-color='%23F472B6'/><stop offset='1' stop-color='%23EC4899'/></linearGradient></defs><path d='M6 9a5 5 0 0 1 5-5h15a11.5 11.5 0 0 1 3.6 22.4A12 12 0 0 1 28 44H11a5 5 0 0 1-5-5z' fill='url(%23a)'/><path d='M6 33c7-7 16-10 26-8a12 12 0 0 1-4 19H11a5 5 0 0 1-5-5z' fill='url(%23b)'/><rect x='12.5' y='11' width='15' height='13' rx='3.2' fill='%23fff'/><path d='m16.4 17.6 2.6 2.6 4.8-4.8' stroke='%232563EB' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round' fill='none'/><path d='M33.5 27.5a4.6 4.6 0 0 0-4.6 4.6c0 3.4 4.6 7.6 4.6 7.6s4.6-4.2 4.6-7.6a4.6 4.6 0 0 0-4.6-4.6z' fill='%23fff'/></svg>" />

  <!-- ข้อมูลตอนแชร์ลิงก์ ให้แอปแชตแสดงชื่อและคำอธิบายแทนลิงก์เปล่า -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Bookvice" />
  <meta property="og:title" content="ค้นหาทุกหมวดรวมกัน — Bookvice" />
  <meta property="og:description" content="ค้นหาข้ามทุกหมวดในครั้งเดียว — ร้านความงาม สนามกีฬา ศูนย์ดูแลรถ และบริการเรียกถึงบ้าน" />
  <meta name="twitter:card" content="summary" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <!-- ฟอนต์หลักคือ FC Mittraphap โหลดจาก web/fonts/ (ดู @font-face ใน app.css)
       IBM Plex Sans Thai เป็นตัวสำรอง ใช้เมื่อยังไม่ได้วางไฟล์ฟอนต์หลัก -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai+Looped:wght@400;500;600;700&display=optional" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css?v=202610240100" />

  <script>
    // ลิงก์เก่าแบบ shops.html?group=play ต้องยังใช้ได้
    // ส่งต่อไปหน้าของกลุ่มนั้นโดยรักษาตัวกรองอื่นไว้ครบ
    //
    // **ต้องอยู่ใน <head> ก่อนโหลดอะไร** เพื่อไม่ให้ผู้ใช้เห็นหน้านี้แวบหนึ่งก่อนเด้ง
    // ใช้ location.replace ไม่ใช่ href เพื่อไม่ให้ปุ่มย้อนกลับติดลูป
    (function () {
      var q = new URLSearchParams(location.search);
      var g = q.get("group");
      if (!g) return;
      if (["care", "play", "auto", "come"].indexOf(g) === -1) return;
      q.delete("group");
      location.replace(g + ".html" + (q.toString() ? "?" + q : ""));
    })();
  </script>
</head>
<body>
  <a href="#main" class="skip-link">ข้ามไปเนื้อหาหลัก</a>
  <div id="navbar"></div>

  <main id="main" class="max-w-6xl mx-auto px-5 py-10">
    <!-- หัวหน้าแบบเดียวกับหน้ากลุ่ม (care/play/auto/come) แต่ใช้พื้นกรมท่า
         เพราะเป็นหน้ารวมทุกกลุ่ม ไม่ใช่กลุ่มใดกลุ่มหนึ่ง -->
    <section class="grp-hero grp-all">
      <div class="grp-hero-in">
        <span class="grp-ic" data-ic="search"></span>
        <div>
          <h1 class="h1 grp-h1">ค้นหาทุกหมวดรวมกัน</h1>
          <p class="grp-lead">
            ค้นข้ามทั้ง 12 หมวดพร้อมกัน เหมาะเวลาที่ยังไม่รู้ว่าอยากได้อะไรแน่ ๆ
            · รู้อยู่แล้วว่าจะจองอะไร เลือกกลุ่มด้านล่างจะเจอตัวกรองที่ตรงกว่า
          </p>
        </div>
      </div>
      <nav class="grp-switch" id="groupLinks" aria-label="ไปยังกลุ่มบริการ"></nav>
    </section>

    <div id="browse"></div>
  </main>

  <div id="footer"></div>

  <script src="js/api.js?v=202610240100"></script>
  <script src="js/ui.js?v=202610240100"></script>
  <script src="js/browse.js?v=202610240100"></script>
  <script>
    renderNavbar("shops");
    renderFooter();
    prefetchOnHover();

    document.querySelectorAll("[data-ic]").forEach((el) => { el.innerHTML = icon(el.dataset.ic, 26); });
    document.getElementById("groupLinks").innerHTML = GROUPS
      .map((g) => `<a href="${g.key}.html">${icon(g.icon, 15)} ${esc(g.name)}</a>`)
      .join("");

    // หน้ารวมไม่รู้ว่าผู้ใช้กำลังหาอะไร จึงเปิดตัวกรองไว้ทุกตัว
    // และการ์ดต้องบอก "หมวดอะไร" ให้ชัด เพราะร้านนวดกับสนามบอลอยู่ปนกัน
    BrowsePage.init({
      group: "",                 // ไม่จำกัดกลุ่ม
      page: "shops.html",
      limit: 9,
      searchLabel: "ค้นหาชื่อร้าน สนาม หรือบริการ",
      categoryLabel: "หมวดหมู่",
      sortHint: "เรียงตามคะแนนรีวิว",
      empty: "ไม่พบที่ตรงกับเงื่อนไข",
      emptyAvail: "ไม่มีที่ไหนว่างในวันนั้น",
      filters: { category: true, district: true, rating: true, certified: true, near: true },
      quickChips: [
        { label: "ทั้งหมด", value: "" },
        { label: "ว่างวันนี้", value: "today" },
        { label: "ว่างพรุ่งนี้", value: "tomorrow" },
      ],
      card: (s) => {
        const g = GROUP_BY_KEY[s.group_key];
        return `
        <a href="shop.html?id=${s.id}" class="card card-link overflow-hidden">
          ${shopArt(s, "h-36", { tag: s.is_certified ? "ผ่านการรับรอง" : null })}
          <div class="p-5">
            ${g ? `<div class="mix-tag">${icon(g.icon, 12)} ${esc(g.name)}</div>` : ""}
            <h3 class="h3 leading-snug mt-1.5">${esc(s.name)}</h3>
            ${s.rating_count > 0 ? `
              <div class="flex items-center gap-2 mt-2.5">
                ${starRow(s.rating_avg)}
                <span class="text-xs text-muted num">
                  ${Number(s.rating_avg).toFixed(1)} · ${s.rating_count} รีวิว
                </span>
              </div>`
            : `<div class="text-xs text-muted mt-2.5">ยังไม่มีรีวิว</div>`}
            <div class="flex items-center gap-3 mt-3 text-xs text-muted flex-wrap">
              <span>${icon("user", 13)} ${s.resource_count} ${esc(s.resource_label)}</span>
              ${priceFrom(s) ? `<span>${priceFrom(s)}</span>` : ""}
            </div>
            ${cardFoot(s)}
          </div>
        </a>`;
      },
    });
  </script>
</body>
</html>
