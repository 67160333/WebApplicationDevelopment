<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ลืมรหัสผ่าน — Bookvice</title>
  <meta name="description" content="ขอลิงก์ตั้งรหัสผ่านใหม่ทางอีเมล" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#16233F" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'><defs><linearGradient id='a' x1='11' y1='5' x2='36' y2='27' gradientUnits='userSpaceOnUse'><stop stop-color='%23F9AE8B'/><stop offset='1' stop-color='%23E8785A'/></linearGradient><linearGradient id='b' x1='11' y1='21' x2='38' y2='43' gradientUnits='userSpaceOnUse'><stop stop-color='%233FC0D6'/><stop offset='1' stop-color='%2322A898'/></linearGradient></defs><rect width='48' height='48' rx='11' fill='%23fff'/><path d='M11 5h16a11 11 0 0 1 0 22H11z' fill='url(%23a)'/><path d='M11 21h18a11 11 0 0 1 0 22H11z' fill='url(%23b)'/><path d='m16.5 32.5 4.5 4.5 9-9' stroke='%23fff' stroke-width='3.4' stroke-linecap='round' stroke-linejoin='round' fill='none'/><rect x='5' y='5' width='6.5' height='38' rx='3.25' fill='%2316233F'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai+Looped:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css?v=202609211200" />
</head>
<body>
  <div id="navbar"></div>

  <main id="main" class="max-w-6xl mx-auto px-5 py-10">
    <div class="card card-pad" style="max-width:430px;margin:0 auto">
      <h1 class="h2">ลืมรหัสผ่าน</h1>
      <p class="text-sm text-muted" style="margin-top:var(--s-2);line-height:1.75">
        กรอกอีเมลที่ใช้สมัคร เราจะส่งลิงก์ตั้งรหัสผ่านใหม่ไปให้
      </p>

      <div id="alert" class="alert" style="display:none;margin-top:var(--s-4)"></div>

      <form id="form" style="margin-top:var(--s-4)">
        <label class="label" for="email">อีเมล</label>
        <input id="email" name="email" type="email" class="input" required
               autocomplete="email" autofocus />
        <button type="submit" class="btn btn-primary btn-block" style="margin-top:var(--s-4)">
          ส่งลิงก์ตั้งรหัสผ่านใหม่
        </button>
      </form>

      <p class="text-sm text-center" style="margin-top:var(--s-4)">
        <a href="login.html" style="color:var(--blue-600)">กลับไปหน้าเข้าสู่ระบบ</a>
      </p>
    </div>
  </main>

  <div id="footer"></div>

  <script src="js/api.js?v=202609211200"></script>
  <script src="js/ui.js?v=202609211200"></script>
  <script>
    renderNavbar("");
    renderFooter();

    const alertBox = document.getElementById("alert");

    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector("button[type=submit]");
      btnBusy(btn, true, "กำลังส่ง");
      try {
        const res = await apiPost("/api/auth/forgot-password", {
          email: document.getElementById("email").value.trim(),
        });
        // เซิร์ฟเวอร์ตอบข้อความเดียวกันเสมอ ไม่ว่าอีเมลนั้นจะมีบัญชีหรือไม่
        // หน้าเว็บจึงต้องไม่เผลอบอกต่างไปจากนั้น ไม่งั้นด่านฝั่งเซิร์ฟเวอร์เสียเปล่า
        showAlert(alertBox, res.message, "success");
        e.target.reset();
      } catch (err) {
        showAlert(alertBox, err.message);
      } finally {
        btnBusy(btn, false);
      }
    });
  </script>
</body>
</html>
