<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ลืมรหัสผ่าน — Bookvice</title>
  <meta name="description" content="ขอลิงก์ตั้งรหัสผ่านใหม่ทางอีเมล" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#16233F" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'><defs><linearGradient id='a' x1='6' y1='4' x2='34' y2='28' gradientUnits='userSpaceOnUse'><stop stop-color='%232563EB'/><stop offset='1' stop-color='%238B5CF6'/></linearGradient><linearGradient id='b' x1='8' y1='40' x2='42' y2='24' gradientUnits='userSpaceOnUse'><stop stop-color='%23FBBF24'/><stop offset='.55' stop-color='%23F472B6'/><stop offset='1' stop-color='%23EC4899'/></linearGradient></defs><path d='M6 9a5 5 0 0 1 5-5h15a11.5 11.5 0 0 1 3.6 22.4A12 12 0 0 1 28 44H11a5 5 0 0 1-5-5z' fill='url(%23a)'/><path d='M6 33c7-7 16-10 26-8a12 12 0 0 1-4 19H11a5 5 0 0 1-5-5z' fill='url(%23b)'/><rect x='12.5' y='11' width='15' height='13' rx='3.2' fill='%23fff'/><path d='m16.4 17.6 2.6 2.6 4.8-4.8' stroke='%232563EB' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round' fill='none'/><path d='M33.5 27.5a4.6 4.6 0 0 0-4.6 4.6c0 3.4 4.6 7.6 4.6 7.6s4.6-4.2 4.6-7.6a4.6 4.6 0 0 0-4.6-4.6z' fill='%23fff'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai+Looped:wght@400;500;600;700&display=optional" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css?v=202610240100" />
</head>
<body>
  <div id="navbar"></div>

  <main id="main" class="max-w-6xl mx-auto px-5 py-10">
    <div class="card card-pad" style="max-width:430px;margin:0 auto">
      <h1 class="h2">ลืมรหัสผ่าน</h1>
      <p class="text-sm text-muted" style="margin-top:var(--s-2);line-height:1.75">
        กรอกอีเมลที่ใช้สมัคร เราจะส่งลิงก์ตั้งรหัสผ่านใหม่ไปให้
      </p>

      <div id="alert" class="alert" style="display:none;margin-top:var(--s-4)"></div>

      <form id="form" style="margin-top:var(--s-4)">
        <label class="label" for="email">อีเมล</label>
        <input id="email" name="email" type="email" class="input" required
               autocomplete="email" autofocus />
        <button type="submit" class="btn btn-primary btn-block" style="margin-top:var(--s-4)">
          ส่งลิงก์ตั้งรหัสผ่านใหม่
        </button>
      </form>

      <p class="text-sm text-center" style="margin-top:var(--s-4)">
        <a href="login.html" style="color:var(--blue-600)">กลับไปหน้าเข้าสู่ระบบ</a>
      </p>
    </div>
  </main>

  <div id="footer"></div>

  <script src="js/api.js?v=202610240100"></script>
  <script src="js/ui.js?v=202610240100"></script>
  <script>
    renderNavbar("");
    renderFooter();

    const alertBox = document.getElementById("alert");

    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector("button[type=submit]");
      btnBusy(btn, true, "กำลังส่ง");
      try {
        const res = await apiPost("/api/auth/forgot-password", {
          email: document.getElementById("email").value.trim(),
        });
        // เซิร์ฟเวอร์ตอบข้อความเดียวกันเสมอ ไม่ว่าอีเมลนั้นจะมีบัญชีหรือไม่
        // หน้าเว็บจึงต้องไม่เผลอบอกต่างไปจากนั้น ไม่งั้นด่านฝั่งเซิร์ฟเวอร์เสียเปล่า
        showAlert(alertBox, res.message, "success");
        e.target.reset();
      } catch (err) {
        showAlert(alertBox, err.message);
      } finally {
        btnBusy(btn, false);
      }
    });
  </script>
</body>
</html>
