<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ดูแลรถยนต์ — Bookvice</title>
  <meta name="description" content="ล้างรถ เคลือบสี ฟิล์มกันร้อน — ฝากรถไว้แล้วรอรับคืน ระบบแนะนำที่ไปได้ระหว่างรอ" />
  <meta name="theme-color" content="#16233F" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'><defs><linearGradient id='a' x1='6' y1='4' x2='34' y2='28' gradientUnits='userSpaceOnUse'><stop stop-color='%232563EB'/><stop offset='1' stop-color='%238B5CF6'/></linearGradient><linearGradient id='b' x1='8' y1='40' x2='42' y2='24' gradientUnits='userSpaceOnUse'><stop stop-color='%23FBBF24'/><stop offset='.55' stop-color='%23F472B6'/><stop offset='1' stop-color='%23EC4899'/></linearGradient></defs><path d='M6 9a5 5 0 0 1 5-5h15a11.5 11.5 0 0 1 3.6 22.4A12 12 0 0 1 28 44H11a5 5 0 0 1-5-5z' fill='url(%23a)'/><path d='M6 33c7-7 16-10 26-8a12 12 0 0 1-4 19H11a5 5 0 0 1-5-5z' fill='url(%23b)'/><rect x='12.5' y='11' width='15' height='13' rx='3.2' fill='%23fff'/><path d='m16.4 17.6 2.6 2.6 4.8-4.8' stroke='%232563EB' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round' fill='none'/><path d='M33.5 27.5a4.6 4.6 0 0 0-4.6 4.6c0 3.4 4.6 7.6 4.6 7.6s4.6-4.2 4.6-7.6a4.6 4.6 0 0 0-4.6-4.6z' fill='%23fff'/></svg>" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Bookvice" />
  <meta property="og:title" content="ดูแลรถยนต์ — Bookvice" />
  <meta property="og:description" content="ล้างรถ เคลือบสี ฟิล์มกันร้อน — ฝากรถไว้แล้วรอรับคืน ระบบแนะนำที่ไปได้ระหว่างรอ" />
  <meta name="twitter:card" content="summary" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai+Looped:wght@400;500;600;700&display=optional" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css?v=202610240100" />
</head>
<body>
  <a href="#main" class="skip-link">ข้ามไปเนื้อหาหลัก</a>
  <div id="navbar"></div>

  <main id="main" class="max-w-6xl mx-auto px-5 py-10">
    <section class="grp-hero grp-auto">
      <div class="grp-hero-in">
        <span class="grp-ic" data-ic="car"></span>
        <div>
          <h1 class="h1 grp-h1">ดูแลรถยนต์</h1>
          <p class="grp-lead">ฝากรถไว้ แล้วรอรับคืน · งานบางอย่างใช้เวลาทั้งวัน เราจึงบอกตั้งแต่แรกว่านานแค่ไหน</p>
        </div>
      </div>
      <div class="grp-cta">
        <div>
          <div class="grp-cta-t">ระหว่างรถอยู่ในร้าน คุณไม่มีพาหนะ</div>
          <div class="grp-cta-s">
            หลังจองเสร็จ ระบบจะแนะนำร้านที่เดินถึงได้ในเวลาที่เหลือ — ดูได้ในหน้าการจองของฉัน
          </div>
        </div>
      </div>

      <nav class="grp-switch" aria-label="เปลี่ยนกลุ่มบริการ"></nav>
    </section>

    <div id="browse"></div>
  </main>

  <div id="footer"></div>

  <script src="js/api.js?v=202610240100"></script>
  <script src="js/ui.js?v=202610240100"></script>
  <script src="js/browse.js?v=202610240100"></script>
  <script>
    renderNavbar("g:auto");
    renderFooter();
    prefetchOnHover();


    // ไอคอนหัวหน้าเพจ — ใส่จาก JS เพราะชุดไอคอนอยู่ใน ui.js ไฟล์เดียว
    document.querySelectorAll("[data-ic]").forEach((el) => {
      el.innerHTML = icon(el.dataset.ic, 26);
    });

    // แถบสลับกลุ่ม — สร้างจาก GROUPS ใน ui.js ไม่ใช่พิมพ์ชื่อซ้ำในทุกหน้า
    // ถ้าวันหนึ่งเปลี่ยนชื่อกลุ่ม จะเปลี่ยนที่เดียวแล้วถูกทั้งเว็บ
    renderGroupSwitch("auto");

    // จุดตัดสินใจของกลุ่มนี้คือ "ต้องเสียเวลากี่ชั่วโมง" ไม่ใช่คะแนนรีวิว
    // เคลือบแก้ว 9H ใช้ 480 นาที = ต้องว่างทั้งวัน ถ้าไม่บอกตั้งแต่หน้ารายการ
    // ลูกค้าจะรู้ตอนจองเสร็จแล้วซึ่งสายไป
    BrowsePage.init({
      group: "auto",
      page: "auto.html",
      limit: 9,
      searchLabel: "ค้นหาศูนย์บริการ เช่น เคลือบสี ฟิล์ม",
      sortHint: "เรียงตามคะแนนรีวิว",
      empty: "ไม่พบศูนย์บริการที่ตรงกับเงื่อนไข",
      emptyAvail: "ไม่มีที่ไหนว่างในวันนั้น",
      filters: { category: false, district: true, rating: false, certified: false, near: true },
      quickChips: [
        { label: "ทั้งหมด", value: "" },
        { label: "ว่างวันนี้", value: "today" },
        { label: "ว่างพรุ่งนี้", value: "tomorrow" },
      ],
      card: (s) => {
        // เตือนเมื่องานยาวเกินครึ่งวัน — เกณฑ์ 240 นาทีคือจุดที่ "รอที่ร้าน" เลิกเป็นทางเลือก
        const longJob = s.duration_max != null && s.duration_max >= 240;
        return `
        <a href="shop.html?id=${s.id}" class="card card-link overflow-hidden">
          ${shopArt(s, "h-36")}
          <div class="p-5">
            <h3 class="h3 leading-snug">${esc(s.name)}</h3>
            <div class="flex items-center gap-3 mt-3 text-xs text-muted flex-wrap">
              <span>${icon("car", 13)} ${s.resource_count} ${esc(s.resource_label)}</span>
              <span>${icon("sparkle", 13)} ${s.service_count} บริการ</span>
              ${priceFrom(s) ? `<span>${priceFrom(s)}</span>` : ""}
            </div>
            ${s.duration_max != null ? `
              <div class="job-len ${longJob ? "is-long" : ""}">
                ${icon("clock", 14)}
                <span>งานยาวที่สุด <b class="num">${durationText(s.duration_max)}</b></span>
                ${longJob ? `<span class="job-tag">ต้องฝากรถไว้</span>` : ""}
              </div>` : ""}
            ${cardFoot(s)}
          </div>
        </a>`;
      },
    });
  </script>
</body>
</html>
