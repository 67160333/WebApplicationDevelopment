<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>โปรไฟล์ผู้ให้บริการ — Bookvice</title>
  <meta name="description" content="ประวัติ ความถนัด คะแนน และรีวิวของผู้ให้บริการ พร้อมจองคิวกับคนนี้โดยตรง" />
  <meta name="theme-color" content="#16233F" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'><defs><linearGradient id='a' x1='11' y1='5' x2='36' y2='27' gradientUnits='userSpaceOnUse'><stop stop-color='%23F9AE8B'/><stop offset='1' stop-color='%23E8785A'/></linearGradient><linearGradient id='b' x1='11' y1='21' x2='38' y2='43' gradientUnits='userSpaceOnUse'><stop stop-color='%233FC0D6'/><stop offset='1' stop-color='%2322A898'/></linearGradient></defs><rect width='48' height='48' rx='11' fill='%23fff'/><path d='M11 5h16a11 11 0 0 1 0 22H11z' fill='url(%23a)'/><path d='M11 21h18a11 11 0 0 1 0 22H11z' fill='url(%23b)'/><path d='m16.5 32.5 4.5 4.5 9-9' stroke='%23fff' stroke-width='3.4' stroke-linecap='round' stroke-linejoin='round' fill='none'/><rect x='5' y='5' width='6.5' height='38' rx='3.25' fill='%2316233F'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai+Looped:wght@400;500;600;700&display=optional" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css?v=202610202500" />
</head>
<body>
  <a href="#main" class="skip-link">ข้ามไปเนื้อหาหลัก</a>
  <div id="navbar"></div>

  <!-- หน้าโปรไฟล์ช่างแบบเต็มหน้า
       ============================================================
       เดิมดูโปรไฟล์ช่างได้แค่ในกล่องป๊อปอัปบนหน้าร้าน ซึ่งแชร์ลิงก์ไม่ได้
       ลูกค้าที่ชอบช่างคนหนึ่งจึงบอกต่อได้แค่ชื่อร้าน ไม่ใช่ตัวช่าง
       หน้านี้มีลิงก์ของตัวเอง (staff.html?id=12) ช่างเอาไปใส่ไบโอโซเชียลได้

       ข้อมูลทั้งหมดมาจากสองเส้น
         GET /api/staff/{id}          โปรไฟล์ สถิติจากงานจริง และบริการของร้าน
         GET /api/staff/{id}/reviews  รีวิวที่ลูกค้าให้ดาวช่างคนนี้ -->
  <main id="main" class="max-w-5xl mx-auto px-5 py-10">
    <div id="content" style="min-height:420px"></div>
  </main>

  <div id="footer"></div>

  <script src="js/api.js?v=202610202500"></script>
  <script src="js/ui.js?v=202610202500"></script>
  <script>
    renderNavbar("");
    renderFooter();

    const content = document.getElementById("content");
    const staffId = Number(new URLSearchParams(location.search).get("id"));
    const REVIEW_PAGE = 5;
    const NEXT_FREE_DAYS = 7;          // ไล่หาคิวว่างล่วงหน้ากี่วัน (ยิงทีละวัน หยุดทันทีที่เจอ)
    let profile = null;
    let reviewPage = 1;

    // สีพื้นรูปแทนตัวเมื่อยังไม่มีรูป — สูตรเดียวกับหน้าร้าน ช่างคนเดิมจึงได้สีเดิมทั้งสองหน้า
    const AV_COLORS = [
      ["#1a63d8", "#4f8ff0"], ["#0f7b6c", "#2fae9c"], ["#8a4bd3", "#b183ea"],
      ["#c2571f", "#e88b4d"], ["#0f294b", "#2f5f96"], ["#b3355f", "#e07a9d"],
    ];
    function avatarHTML(p, cls = "av-2xl") {
      if (p.photo_url) {
        return `<span class="${cls} has-photo"><img src="${esc(fileUrl(p.photo_url))}" alt="${esc(p.name)}" /></span>`;
      }
      let h = 0;
      for (const ch of p.name) h = (h * 31 + ch.charCodeAt(0)) % 9973;
      const [a, b] = AV_COLORS[h % AV_COLORS.length];
      return `<span class="${cls}" style="background:linear-gradient(135deg,${a},${b})">${esc(p.name.trim().charAt(0))}</span>`;
    }

    // ---------- ตารางทำงานรายสัปดาห์ ----------
    // วันที่ช่างเข้างาน = วันที่ช่างเลือกไว้ (ว่าง = ทุกวัน) และร้านต้องไม่หยุดประจำวันนั้นด้วย
    function weekHTML(p, shop) {
      const mine = p.work_days ? p.work_days.split(",").map(Number) : [0, 1, 2, 3, 4, 5, 6];
      const shopOff = (shop && shop.closed_weekdays ? shop.closed_weekdays.split(",") : []).map(Number);
      const open = (d) => mine.includes(d) && !shopOff.includes(d);
      const today = new Date().getDay();
      const start = p.work_start || (shop && shop.open_time);
      const end = p.work_end || (shop && shop.close_time);
      return `
        <div class="sp-week">
          ${["อา", "จ", "อ", "พ", "พฤ", "ศ", "ส"].map((d, i) => `
            <span class="${open(i) ? "on" : ""} ${i === today ? "today" : ""}"
                  title="${DOW_TH_FULL[i]}${open(i) ? "" : " · หยุด"}">${d}</span>`).join("")}
        </div>
        ${start && end ? `<p class="text-sm mt-3"><span class="num">${shortTime(start)}–${shortTime(end)}</span> น.</p>` : ""}`;
    }

    // ---------- ตัวเลขจากงานจริง ----------
    // ช่องที่ยังไม่มีข้อมูลไม่ต้องโชว์ — เลข 0 อ่านแล้วเหมือนช่างฝีมือแย่ ทั้งที่แค่เพิ่งเริ่มใช้ระบบ
    function factsHTML(p) {
      const cells = [];
      if (p.experience_years) cells.push([`${p.experience_years} ปี`, "ประสบการณ์"]);
      if (p.jobs_done) cells.push([p.jobs_done, "งานที่ทำเสร็จ"]);
      if (p.total_customers) cells.push([p.total_customers, "ลูกค้าที่ดูแล"]);
      if (p.repeat_rate !== null && p.repeat_rate !== undefined) cells.push([`${p.repeat_rate}%`, "กลับมาใช้ซ้ำ"]);
      if (p.months_with_shop) {
        cells.push([p.months_with_shop >= 12 ? `${Math.floor(p.months_with_shop / 12)} ปี` : `${p.months_with_shop} เดือน`, "อยู่กับร้านนี้"]);
      }
      // ข้อมูลเดียวไม่ต้องทำเป็นแถบ ให้ไปต่อท้ายบรรทัดชื่อร้านแทน (ดู subFact) ไม่งั้นแถบโล่งทั้งแถว
      if (cells.length < 2) return "";
      return `<dl class="sp-facts">${cells.slice(0, 4).map(([v, t]) =>
        `<div><dt>${t}</dt><dd class="num">${v}</dd></div>`).join("")}</dl>`;
    }

    function subFact(p) {
      if (p.experience_years || p.jobs_done || p.total_customers) return "";
      if (!p.months_with_shop) return "";
      return p.months_with_shop >= 12
        ? ` · อยู่กับร้าน ${Math.floor(p.months_with_shop / 12)} ปี`
        : ` · อยู่กับร้าน ${p.months_with_shop} เดือน`;
    }

    function aspectsHTML(a) {
      const rows = [
        ["ฝีมือ", a && a.skill], ["ความสะอาด", a && a.cleanliness],
        ["ตรงเวลา", a && a.punctuality], ["ความคุ้มค่า", a && a.value],
      ].filter(([, v]) => v !== null && v !== undefined);
      if (!rows.length) return "";
      return `
        <div class="sa-rows mt-4">
          ${rows.map(([label, v]) => `
            <div class="sa-row">
              <span class="sa-name">${label}</span>
              <span class="sa-bar"><i style="width:${(v / 5 * 100).toFixed(0)}%"></i></span>
              <b class="num">${Number(v).toFixed(1)}</b>
            </div>`).join("")}
        </div>`;
    }

    async function load() {
      if (!staffId) {
        content.innerHTML = emptyHTML("user", "ไม่พบผู้ให้บริการ", "ลิงก์นี้ไม่ถูกต้อง");
        return;
      }
      content.innerHTML = loadingHTML();
      let shop = null;
      try {
        profile = await apiGet(`/api/staff/${staffId}`);
        // ข้อมูลร้าน: รูปปก วันหยุดประจำ และช่างคนอื่น — โหลดไม่ได้ก็ยังแสดงโปรไฟล์ได้
        shop = await apiGet(`/api/shops/${profile.shop_id}`).catch(() => null);
      } catch (err) {
        content.innerHTML = emptyHTML("user", "ไม่พบผู้ให้บริการ", err.message);
        return;
      }
      const p = profile;
      document.title = `${p.name} · ${p.shop_name} | Bookvice`;
      const where = [p.shop_district, p.shop_province].filter(Boolean).join(", ");
      const tags = (p.specialties || "").split(",").map((x) => x.trim()).filter(Boolean);
      const bookUrl = `shop.html?id=${p.shop_id}&staff=${p.id}`;
      const others = ((shop && shop.staff) || []).filter((x) => x.id !== p.id && x.is_active);
      const cover = shop && shop.cover_url ? fileUrl(shop.cover_url) : null;

      content.innerHTML = `
        <section class="card sp-hero">
          <div class="sp-cover ${cover ? "" : "is-plain"}" ${cover ? `style="background-image:url('${esc(cover)}')"` : ""}></div>
          <div class="sp-head">
            ${avatarHTML(p)}
            <div class="sp-who">
              <h1 class="h1">${esc(p.name)}</h1>
              <p class="sp-sub">
                ${p.position ? `${esc(p.position)} · ` : ""}<a href="shop.html?id=${p.shop_id}">${esc(p.shop_name)}</a>
                ${where ? `<span class="text-muted"> · ${esc(where)}</span>` : ""}<span class="text-muted">${subFact(p)}</span>
              </p>
              <p class="sp-rating">
                ${p.rating_count
                  ? `${starRow(p.rating_avg, 14)}
                     <b class="num">${Number(p.rating_avg).toFixed(1)}</b>
                     <a href="#reviewsBox" class="text-muted">${p.rating_count} รีวิว</a>`
                  : `<span class="text-muted">ยังไม่มีรีวิว</span>`}
              </p>
            </div>
            <div class="sp-cta">
              ${p.is_active
                ? `<a href="${bookUrl}" class="btn btn-primary">จองคิวกับ${esc(p.name)}</a>`
                : `<span class="badge badge-cancelled">พักงานอยู่ ยังไม่รับคิว</span>`}
              <button id="shareBtn" class="btn btn-outline" type="button">คัดลอกลิงก์</button>
            </div>
          </div>
          ${factsHTML(p)}
        </section>

        <div class="staff-cols">
          <div class="space-y-4">
            <section class="card card-pad">
              <h2 class="h3">เกี่ยวกับ${esc(p.name)}</h2>
              ${p.bio
                ? `<p class="sp-bio">${esc(p.bio)}</p>`
                : `<p class="text-sm text-muted mt-2">ยังไม่ได้เขียนแนะนำตัว</p>`}
              ${tags.length ? `
                <h3 class="sp-label">ความถนัด</h3>
                <div class="svc-tags">${tags.map((t) => `<span class="svc-tag">${esc(t)}</span>`).join("")}</div>` : ""}
              ${p.top_services && p.top_services.length ? `
                <h3 class="sp-label">ทำบ่อยที่สุด <span class="text-muted" style="font-weight:400">(นับจากงานจริง)</span></h3>
                <div class="svc-tags">${p.top_services.map((s) =>
                  `<span class="svc-tag">${esc(s.name)} <b class="num">${s.count}</b></span>`).join("")}</div>` : ""}
            </section>

            <section class="card card-pad" id="reviewsBox">
              <div class="flex items-baseline justify-between gap-2">
                <h2 class="h3">รีวิว</h2>
                ${p.rating_count ? `<span class="text-sm text-muted">${p.rating_count} รายการ</span>` : ""}
              </div>
              ${aspectsHTML(p.aspects)}
              <div id="reviews" class="mt-3"></div>
              <button id="moreReviews" class="btn btn-ghost btn-sm mt-2" style="display:none">ดูรีวิวเพิ่ม</button>
            </section>
          </div>

          <aside class="space-y-4 sp-side">
            ${p.is_active && p.services && p.services.length ? `
              <section class="card card-pad">
                <h2 class="h3">คิวว่างเร็วที่สุด</h2>
                <div id="nextFree" class="mt-2"><p class="text-sm text-muted">กำลังหาช่องว่าง</p></div>
              </section>` : ""}

            <section class="card card-pad">
              <h2 class="h3">วันทำงาน</h2>
              <div class="mt-3">${weekHTML(p, shop)}</div>
            </section>

            ${p.is_active && p.services && p.services.length ? `
              <section class="card card-pad">
                <h2 class="h3">บริการและราคา</h2>
                <div class="mt-1">${p.services.map((s) => `
                  <a class="svc-line" href="${bookUrl}&service=${s.id}">
                    <span class="n text-sm">${esc(s.name)}
                      <span class="block text-xs text-muted">${durationText(s.duration_minutes)}</span></span>
                    <span class="num text-sm font-medium">฿${baht(s.price)}</span>
                  </a>`).join("")}</div>
              </section>` : ""}

            ${others.length ? `
              <section class="card card-pad">
                <h2 class="h3">คนอื่นใน ${esc(p.shop_name)}</h2>
                <div class="sp-others">${others.slice(0, 6).map((o) => `
                  <a href="staff.html?id=${o.id}">
                    ${avatarHTML(o, "av-lg")}
                    <span><b>${esc(o.name)}</b><span class="text-xs text-muted">${esc(o.position || "")}</span></span>
                  </a>`).join("")}</div>
              </section>` : ""}
          </aside>
        </div>`;

      document.getElementById("shareBtn").addEventListener("click", async (e) => {
        const btn = e.currentTarget;
        try {
          await navigator.clipboard.writeText(location.href);
          toast("คัดลอกลิงก์แล้ว");
        } catch {
          toast("คัดลอกไม่สำเร็จ ลองคัดลอกจากแถบที่อยู่แทน", "error");
        }
        btn.blur();
      });
      document.getElementById("moreReviews").addEventListener("click", () => loadReviews(reviewPage + 1));
      loadReviews(1);
      if (p.is_active && p.services && p.services.length) loadNextFree(p, bookUrl);
    }

    // หาวันแรกที่ช่างคนนี้ว่าง ใช้บริการแรกของร้านเป็นตัวตั้ง
    // ใช้ API เดียวกับหน้าจอง วันลา วันหยุดร้าน และคิวที่จ่ายแล้วจึงถูกตัดออกให้ครบ
    async function loadNextFree(p, bookUrl) {
      const box = document.getElementById("nextFree");
      const svc = p.services[0];
      for (let d = 0; d < NEXT_FREE_DAYS; d++) {
        const day = localDate(dateAfter(d));
        try {
          const av = await apiGet(`/api/services/${svc.id}/availability?date=${day}&staff_id=${p.id}`);
          const free = (av.slots || []).filter((x) => x.available);
          if (!free.length) continue;
          const label = d === 0 ? "วันนี้" : d === 1 ? "พรุ่งนี้" : thaiDate(day);
          box.innerHTML = `
            <p class="text-sm"><b>${label}</b> <span class="text-muted">· ${esc(svc.name)}</span></p>
            <div class="sp-times">${free.slice(0, 6).map((x) =>
              `<a class="num" href="${bookUrl}&service=${svc.id}&date=${day}">${shortTime(x.time)}</a>`).join("")}</div>
            ${free.length > 6 ? `<p class="text-xs text-muted mt-2">และอีก ${free.length - 6} ช่วงในวันนั้น</p>` : ""}`;
          return;
        } catch {
          break;
        }
      }
      box.innerHTML = `<p class="text-sm text-muted">ไม่มีช่องว่างใน ${NEXT_FREE_DAYS} วันข้างหน้า</p>
        <a href="${bookUrl}" class="text-sm">ดูตารางทั้งหมด</a>`;
    }

    async function loadReviews(page) {
      const box = document.getElementById("reviews");
      const more = document.getElementById("moreReviews");
      if (page === 1) box.innerHTML = loadingHTML();
      try {
        const rv = await apiGet(`/api/staff/${staffId}/reviews?page=${page}&limit=${REVIEW_PAGE}`);
        reviewPage = page;
        const html = rv.items.map((r) => `
          <div class="mini-review">
            <div class="flex items-center justify-between gap-2">
              <span class="flex items-center gap-2">
                <span class="text-sm font-medium">${esc(r.user_name || "ผู้ใช้บริการ")}</span>
                ${starRow(r.staff_rating, 12)}
              </span>
              <time class="text-xs text-muted" title="${thaiDate(r.created_at.slice(0, 10))}">${timeAgo(r.created_at)}</time>
            </div>
            ${r.comment ? `<p class="text-sm mt-1.5">${esc(r.comment)}</p>` : ""}
            ${r.reply ? `<p class="text-xs text-muted mt-1">ร้านตอบ: ${esc(r.reply)}</p>` : ""}
          </div>`).join("");
        if (page === 1) {
          box.innerHTML = html || `<p class="text-sm text-muted">ยังไม่มีใครรีวิว — ใช้บริการแล้วกลับมาเล่าให้คนอื่นฟังได้ที่หน้าการจองของฉัน</p>`;
        } else box.insertAdjacentHTML("beforeend", html);
        // ใช้ style แทน hidden เพราะ .btn ตั้ง display ไว้ ทำให้ attribute hidden ไม่มีผล
        more.style.display = page >= rv.total_pages ? "none" : "";
      } catch (err) {
        if (page === 1) box.innerHTML = `<p class="text-sm" style="color:var(--danger)">${esc(err.message)}</p>`;
        else toast(err.message, "error");
      }
    }

    load();
  </script>
</body>
</html>
