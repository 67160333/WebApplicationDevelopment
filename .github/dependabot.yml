# ให้ GitHub คอยเช็กว่าไลบรารีที่ใช้อยู่มีช่องโหว่ที่ประกาศออกมาแล้วหรือยัง
#
# ทำไมต้องมี
# ------------------------------------------------------------------
# requirements.txt ล็อกเวอร์ชันไว้ตายตัว (เช่น Pillow==11.1.0) ซึ่งดีตรงที่
# รันที่ไหนก็ได้ผลเหมือนกัน แต่แปลว่าถ้าเวอร์ชันนั้นมีช่องโหว่ประกาศออกมาทีหลัง
# เว็บเราจะใช้ของที่มีรูต่อไปเรื่อย ๆ โดยไม่มีใครรู้
#
# ไฟล์นี้ให้ GitHub เปิด Pull Request มาเสนออัปเดตให้เองทุกสัปดาห์
# เราแค่อ่าน ดูว่าเทสต์ผ่าน แล้วกด Merge
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
