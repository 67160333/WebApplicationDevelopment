# ปลุกเว็บจริงไม่ให้หลับ
#
# ทำไมต้องมีไฟล์นี้
# ------------------------------------------------------------------
# Render แบบฟรีจะปิดเซิร์ฟเวอร์เมื่อไม่มีคนเข้า 15 นาที
# คนถัดไปที่เปิดเว็บต้องนั่งดูหน้าดำของ Render 30-60 วินาที
# หลายคนคิดว่าเว็บพังแล้วปิดทิ้งไปก่อน
#
# ไฟล์นี้ให้ GitHub เรียก /health ทุก 10 นาที เซิร์ฟเวอร์จึงไม่เคยว่างถึง 15 นาที
#
# เรียก /health เพราะไม่แตะฐานข้อมูล
# ถ้าเรียกหน้าที่ query ฐานข้อมูล Neon จะตื่นตลอดเวลาและกินโควตาฟรีหมดเร็ว
# ฐานข้อมูลตื่นช้าแค่ราว 1 วินาที ไม่ใช่ปัญหาเหมือนเซิร์ฟเวอร์
#
# ข้อจำกัดที่ต้องรู้
# ------------------------------------------------------------------
# - Render ฟรีให้ 750 ชั่วโมงต่อเดือน เปิดตลอดใช้ราว 720 ชั่วโมง
#   ถ้ามีเซิร์ฟเวอร์ฟรีตัวอื่นบนบัญชีเดียวกัน ชั่วโมงจะไม่พอ
# - GitHub อาจเลื่อนเวลารันไปบ้างเมื่อคิวแน่น บางครั้งเว็บยังหลับได้
# - GitHub ปิดงานตั้งเวลาเองถ้า repo ไม่มีความเคลื่อนไหว 60 วัน
#   ถ้าเว็บกลับมาหลับอีก ให้เข้าแท็บ Actions แล้วกดเปิดใหม่

name: Keep Render awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: เรียก /health
        # --max-time 90 เผื่อกรณีเซิร์ฟเวอร์หลับไปแล้วต้องรอตื่น
        # || true เพราะถ้า Render ล่มชั่วคราว ไม่อยากให้ GitHub ส่งอีเมลเตือนทุก 10 นาที
        run: curl -fsS --max-time 90 https://bookvice.onrender.com/health || true
