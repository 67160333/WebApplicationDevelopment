services:
  # ---------- ฐานข้อมูล PostgreSQL ----------
  db:
    image: postgres:16-alpine
    container_name: bookvice-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Bangkok
    ports:
      - "${DB_PORT_HOST}:5432"
    volumes:
      # volume เก็บข้อมูลถาวร ลบ container แล้วข้อมูลไม่หาย
      - db_data:/var/lib/postgresql/data
    healthcheck:
      # ให้ service api รอจนฐานข้อมูลพร้อมจริงก่อนค่อยเริ่มทำงาน
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - bookvice-net

  # ---------- FastAPI ----------
  api:
    build: .
    container_name: bookvice-api
    restart: unless-stopped
    environment:
      # service คุยกันด้วย "ชื่อ service" ได้เลย (db) ไม่ต้องรู้ IP — ตามที่เรียนใน Lab 3
      DATABASE_URL: postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES}
      SEED_ON_START: ${SEED_ON_START}
      TZ: Asia/Bangkok
    ports:
      - "${API_PORT}:8000"
    volumes:
      # รูปที่ผู้ใช้อัปโหลด เก็บนอก container เหมือนกับฐานข้อมูล
      # ถ้าไม่ทำแบบนี้ รูปจะหายทุกครั้งที่ build ใหม่ เพราะไฟล์อยู่ในชั้น image ที่ถูกแทนที่
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bookvice-net

  # ---------- หน้าเว็บ (Frontend) เสิร์ฟด้วย nginx ----------
  web:
    image: nginx:alpine
    container_name: bookvice-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT}:80"
    volumes:
      # mount ไฟล์เข้า container โดยตรง แก้โค้ดแล้วรีเฟรชเห็นผลทันที ไม่ต้อง build ใหม่
      - ./web:/usr/share/nginx/html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - bookvice-net

  # ---------- pgAdmin (ไว้ดูข้อมูลผ่านเว็บ) ----------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: bookvice-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bookvice-net

volumes:
  db_data:
  uploads_data:

networks:
  bookvice-net:
    driver: bridge
